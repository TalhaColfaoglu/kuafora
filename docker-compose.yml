services:
  db:
    image: postgres:16-alpine
    container_name: kuafora_db
    restart: unless-stopped
    env_file:
      - ./env/db.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [kuafora_net]
  backend:
    build:
      context: ./kuafora-mobile-app-backend
      dockerfile: Dockerfile.prod
    container_name: kuafora_backend
    restart: unless-stopped
    user: "root"
    env_file:
      - ./env/backend.env
    environment:
      - ALLOWED_HOSTS=localhost,127.0.0.1,3.122.14.242,api.kuafora.com
    expose:
      - "8000"
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    networks: [kuafora_net]
    depends_on:
      - db

  website:
    build:
      context: ./kuafora-website
      dockerfile: Dockerfile
    container_name: kuafora_website
    restart: unless-stopped
    env_file:
      - ./env/website.env
    environment:
      # Website Django projesi için izin verilen hostlar
      # Healthcheck'ler localhost:8001 ile geldiği için mutlaka localhost ve 127.0.0.1 dahil edilmeli
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,kuafora.com,www.kuafora.com
    expose:
      - "8001"
    volumes:
      - website_static:/app/staticfiles
      - website_media:/app/mediafiles
    networks: [kuafora_net]
    depends_on:
      - db

  cron:
    build:
      context: ./kuafora-mobile-app-backend
      dockerfile: Dockerfile.prod
    container_name: kuafora_cron
    restart: unless-stopped
    user: "root"
    env_file:
      - ./env/backend.env
    environment:
      - ALLOWED_HOSTS=localhost,127.0.0.1,3.122.14.242,api.kuafora.com
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    networks: [kuafora_net]
    depends_on:
      - db
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["/app/cron_entrypoint.sh"]

  notify_worker:
    build:
      context: ./kuafora-mobile-app-backend
      dockerfile: Dockerfile.prod
    container_name: kuafora_notify
    restart: unless-stopped
    env_file:
      - ./env/backend.env
    networks: [kuafora_net]
    depends_on:
      - db
      - backend
    entrypoint: ["python","manage.py","process_notifications"]

  nginx:
    image: nginx:alpine
    container_name: kuafora_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - website
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - backend_static:/var/www/backend/staticfiles:ro
      - backend_media:/var/www/backend/media:ro
      - website_static:/var/www/website/staticfiles:ro
      - website_media:/var/www/website/mediafiles:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    networks: [kuafora_net]

  certbot:
    image: certbot/certbot:latest
    container_name: kuafora_certbot
    depends_on:
      - nginx
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        # Obtain/renew certificates for api.kuafora.com and kuafora.com (webroot)
        certbot certonly --webroot -w /var/www/certbot \
          -d api.kuafora.com -d kuafora.com -d www.kuafora.com \
          --agree-tos --register-unsafely-without-email --non-interactive --keep-until-expiring
        # Keep container alive (optional); comment if you prefer one-shot
        sleep 3600

networks:
  kuafora_net:
    driver: bridge

volumes:
  postgres_data:
  backend_static:
  backend_media:
  website_static:
  website_media:


