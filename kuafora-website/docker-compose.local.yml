version: '3.8'

services:
  web:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    environment:
      - DEBUG=True
      - SECRET_KEY=local-development-key-not-for-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DATABASE_URL=postgresql://kuafora_user:dev_password@db:5432/kuafora_db
    depends_on:
      - db
      - redis
    networks:
      - kuafora_network
    command: python manage.py runserver 0.0.0.0:8001

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data_local:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=kuafora_db
      - POSTGRES_USER=kuafora_user
      - POSTGRES_PASSWORD=dev_password
    ports:
      - "5432:5432"
    networks:
      - kuafora_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - kuafora_network

volumes:
  postgres_data_local:
  static_volume:
  media_volume:

networks:
  kuafora_network:
    driver: bridge
