server {
    listen 80;
    listen [::]:80;
    server_name kuafora.com www.kuafora.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kuafora.com www.kuafora.com;

    ssl_certificate /etc/letsencrypt/live/kuafora.com/fullchain.pem; # managed by certbot
    ssl_certificate_key /etc/letsencrypt/live/kuafora.com/privkey.pem; # managed by certbot
    ssl_trusted_certificate /etc/letsencrypt/live/kuafora.com/chain.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers (Website)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP kept permissive to avoid breaking inline assets; tighten after observing console errors
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; connect-src 'self' https: wss:;" always;

    # Static files
    location /static/ {
        alias /var/www/website/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Media files
    location /media/ {
        alias /var/www/website/mediafiles/;
        access_log off;
        expires 30d;
    }

    # Use Docker DNS resolver for upstreams
    resolver 127.0.0.11 ipv6=off;

    location / {
        # Dinamik DNS resolve (container IP değişince 502 olmasın)
        set $website_upstream website:8001;
        proxy_pass http://$website_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        client_max_body_size 25m;
    }
}


