server {
    listen 80;
    listen [::]:80;
    server_name api-dev.kuafora.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-dev.kuafora.com;

    # Tek sertifika: kuafora.com cert'i altında tüm domainler (api/api-dev/www) tutulur.
    ssl_certificate /etc/letsencrypt/live/kuafora.com/fullchain.pem; # managed by certbot
    ssl_certificate_key /etc/letsencrypt/live/kuafora.com/privkey.pem; # managed by certbot
    ssl_trusted_certificate /etc/letsencrypt/live/kuafora.com/chain.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # DEV static/media (ayrı volume path)
    location /static/ {
        alias /var/www/backend_dev/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /var/www/backend_dev/media/;
        access_log off;
        expires 7d;
    }

    resolver 127.0.0.11 ipv6=off;

    location / {
        set $backend_upstream backend_dev:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        client_max_body_size 25m;
    }
}


