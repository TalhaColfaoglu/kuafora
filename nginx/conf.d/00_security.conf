# Rate limiting zones (http context)
# Notes:
# - Keep these limits conservative; adjust after observing logs (429 rates).
# - Nginx limits are per-IP (best at edge). Backend will add a second layer.
#
# Keyed by $binary_remote_addr for memory efficiency.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;

# Auth endpoints (tighter)
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_register:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=auth_check_email:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=auth_forgot_password:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_verify_email:10m rate=5r/m;


