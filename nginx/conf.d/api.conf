server {
    listen 80;
    listen [::]:80;
    server_name api.kuafora.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kuafora.com;

    ssl_certificate /etc/letsencrypt/live/api.kuafora.com/fullchain.pem; # managed by certbot
    ssl_certificate_key /etc/letsencrypt/live/api.kuafora.com/privkey.pem; # managed by certbot
    ssl_trusted_certificate /etc/letsencrypt/live/api.kuafora.com/chain.pem;

    # Security and performance basics
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Static files
    location /static/ {
        alias /var/www/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Media files
    location /media/ {
        alias /var/www/backend/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        client_max_body_size 25m;
    }
}


