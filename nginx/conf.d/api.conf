server {
    listen 80;
    listen [::]:80;
    server_name api.kuafora.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.kuafora.com;
    merge_slashes on;

    # Tek sertifika: kuafora.com cert'i altında tüm domainler (api/api-dev/www) tutulur.
    ssl_certificate /etc/letsencrypt/live/kuafora.com/fullchain.pem; # managed by certbot
    ssl_certificate_key /etc/letsencrypt/live/kuafora.com/privkey.pem; # managed by certbot
    ssl_trusted_certificate /etc/letsencrypt/live/kuafora.com/chain.pem;

    # Security and performance basics
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers (API)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Static files
    location /static/ {
        alias /var/www/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Media files
    location /media/ {
        alias /var/www/backend/media/;
        access_log off;
        expires 30d;
    }

    # Use Docker DNS resolver for upstreams
    resolver 127.0.0.11 ipv6=off;

    # Bot taramaları / gereksiz istekler backend'e düşmesin (404 spam + yük)
    location = / {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    location = /favicon.ico {
        access_log off;
        return 204;
    }
    location ~* ^/+\.git {
        access_log off;
        return 444;
    }
    location ~* ^/+(?:wp-admin|wp-includes|wp-content|wordpress|xmlrpc\.php|wlwmanifest\.xml) {
        access_log off;
        return 444;
    }

    # General API rate limit (very soft)
    location ^~ /api/ {
        limit_req zone=api_general burst=60 nodelay;

        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        client_max_body_size 25m;
    }

    # Auth abuse protection (strict)
    location = /api/auth/login/ {
        limit_req zone=auth_login burst=8 nodelay;

        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        client_max_body_size 1m;
    }
    location = /api/auth/register/ {
        limit_req zone=auth_register burst=4 nodelay;

        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        client_max_body_size 1m;
    }
    location = /api/auth/check-email/ {
        limit_req zone=auth_check_email burst=10 nodelay;

        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
        client_max_body_size 1m;
    }
    location = /api/auth/forgot-password/ {
        limit_req zone=auth_forgot_password burst=3 nodelay;

        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        client_max_body_size 1m;
    }
    location = /api/auth/verify-email/ {
        limit_req zone=auth_verify_email burst=3 nodelay;

        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        client_max_body_size 1m;
    }

    location / {
        # Nginx, Docker DNS'i sadece startup'ta resolve edebilir.
        # Variable proxy_pass + resolver ile her request'te yeniden resolve edilir
        # (backend container IP değişince 502/host unreachable problemi biter).
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        client_max_body_size 25m;
    }
}


