{% extends "admin/change_form.html" %}
{% load static %}

{% block content %}
{% if original %}
<p style="margin-bottom: 16px;">
    <a href="{% url 'admin-barbershop-preview' original.pk %}" target="_blank" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 14px; box-shadow: 0 2px 8px rgba(59,130,246,0.3);">
        📱 Detay ekranı önizlemesi (kuaförü uygulama gibi gör)
    </a>
    <a href="{% url 'admin:subscriptions_subscription_quick_apply' %}?barbershop_id={{ original.pk }}" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; margin-left: 10px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 14px; box-shadow: 0 2px 8px rgba(16,185,129,0.25);">
        🎟️ Kupon uygula (abonelik)
    </a>
</p>
{% endif %}
{{ block.super }}
{# Lightbox: tıklanınca görseli büyük göster #}
<div id="admin-barbershop-lightbox" style="display: none; position: fixed; inset: 0; z-index: 99999; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; cursor: pointer;" onclick="this.style.display='none';">
    <img id="admin-barbershop-lightbox-img" src="" alt="" style="max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: none;">
</div>
<button type="button" id="admin-barbershop-lightbox-close" style="display: none; position: fixed; top: 16px; right: 16px; z-index: 100000; background: #fff; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">Kapat</button>
<script>
(function() {
    function initLightbox() {
        var overlay = document.getElementById('admin-barbershop-lightbox');
        var imgEl = document.getElementById('admin-barbershop-lightbox-img');
        var closeBtn = document.getElementById('admin-barbershop-lightbox-close');
        if (!overlay || !imgEl) return;
        document.querySelectorAll('.admin-barbershop-img-link').forEach(function(a) {
            a.addEventListener('click', function(e) {
                e.preventDefault();
                var href = this.getAttribute('href');
                if (href) {
                    imgEl.src = href;
                    imgEl.alt = 'Görsel';
                    overlay.style.display = 'flex';
                    if (closeBtn) closeBtn.style.display = 'block';
                }
            });
        });
        function hide() {
            overlay.style.display = 'none';
            if (closeBtn) closeBtn.style.display = 'none';
        }
        overlay.addEventListener('click', hide);
        if (closeBtn) closeBtn.addEventListener('click', hide);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') hide();
        });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initLightbox);
    } else {
        initLightbox();
    }
})();
</script>
{% endblock %}
